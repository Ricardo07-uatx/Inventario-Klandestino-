<!DOCTYPE html>
<html>
<head>
  <title>Inventario de Pans</title>
  <style>
    .low-stock { background-color: #ffdddd; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>Inventario de Pans</h1>
  
  <div>
    <select id="movementType">
      <option value="entrada">Entrada</option>
      <option value="salida">Salida</option>
    </select>
    <input type="text" id="productId" placeholder="ID Producto">
    <input type="number" id="quantity" placeholder="Cantidad">
    <button onclick="registrarMovimientoUI()">Registrar</button>
  </div>

  <table id="inventoryTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Tipo</th>
        <th>Entradas</th>
        <th>Salidas</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody>
      <!-- Datos se cargarán aquí -->
    </tbody>
  </table>

  <script src="script.js"></script>
  <script>
    async function registrarMovimientoUI() {
      const tipo = document.getElementById('movementType').value;
      const id = document.getElementById('productId').value;
      const cantidad = document.getElementById('quantity').value;
      
      if (await registrarMovimiento(tipo, id, cantidad)) {
        document.getElementById('productId').value = '';
        document.getElementById('quantity').value = '';
      }
    }
  </script>
</body>
</html>
