<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <h1>Inventario de Mercancía</h1>

  <table>
    <thead>
      <tr>
        <th>Número de Producto</th>
        <th>Nombre de Producto</th>
        <th>Tipo de Producto</th>
        <th>Entradas</th>
        <th>Salidas</th>
        <th>Inventario</th>
      </tr>
    </thead>
    <tbody id="inventory-table">
      <!-- Datos cargados dinámicamente -->
    </tbody>
  </table>

  <h2>Registrar Entrada</h2>
  <form id="entrada-form">
    <input type="text" id="numeroProductoEntrada" placeholder="Número de Producto" required>
    <input type="number" id="cantidadEntrada" placeholder="Cantidad" required>
    <button type="submit">Agregar Entrada</button>
  </form>

  <h2>Registrar Salida</h2>
  <form id="salida-form">
    <input type="text" id="numeroProductoSalida" placeholder="Número de Producto" required>
    <input type="number" id="cantidadSalida" placeholder="Cantidad" required>
    <button type="submit">Agregar Salida</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
