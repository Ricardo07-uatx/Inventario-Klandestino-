<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f8fa;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            align-items: center;
        }
        .refresh-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .loading {
            display: none;
            color: #7f8c8d;
            font-style: italic;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th {
            background: #3498db;
            color: white;
            padding: 12px 10px;
            text-align: left;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .low-stock {
            color: #e74c3c;
            font-weight: bold;
        }
        .edit-btn {
            background: #f39c12;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .error-message {
            display: none;
            background: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
        }
        .success-message {
            display: none;
            background: #2ecc71;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sistema de Inventario</h1>
        
        <div class="controls">
            <button class="refresh-btn">Actualizar inventario</button>
            <div class="loading">Cargando datos...</div>
        </div>
        
        <table id="inventory-table">
            <thead>
                <tr>
                    <th>Número</th>
                    <th>Tipo de Producto</th>
                    <th>Entradas</th>
                    <th>Salidas</th>
                    <th>Inventario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Datos se cargarán aquí -->
            </tbody>
        </table>
        
        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>
    </div>

    <script>
        // Configuración - REEMPLAZA CON TU URL
        const APPS_SCRIPT_URL = "TU_URL_DE_APPS_SCRIPT";
        
        // Elementos del DOM
        const elements = {
            tableBody: document.querySelector('#inventory-table tbody'),
            refreshBtn: document.querySelector('.refresh-btn'),
            loading: document.querySelector('.loading'),
            error: document.getElementById('error-message'),
            success: document.getElementById('success-message')
        };
        
        // Cargar inventario al iniciar
        document.addEventListener('DOMContentLoaded', loadInventory);
        
        // Configurar botón de actualización
        elements.refreshBtn.addEventListener('click', loadInventory);
        
        // Función principal para cargar inventario
        async function loadInventory() {
            try {
                showLoading();
                hideMessages();
                
                const response = await fetch(`${APPS_SCRIPT_URL}?action=getInventory`);
                
                if (!response.ok) {
                    throw new Error('Error al conectar con el servidor');
                }
                
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.message || 'Error en los datos recibidos');
                }
                
                renderInventory(data.inventory);
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }
        
        // Mostrar datos en la tabla
        function renderInventory(inventory) {
            elements.tableBody.innerHTML = '';
            
            if (!inventory || inventory.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = '<td colspan="6" style="text-align: center;">No hay productos registrados</td>';
                elements.tableBody.appendChild(row);
                return;
            }
            
            inventory.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.numero}</td>
                    <td>${item.tipo}</td>
                    <td>${item.entradas}</td>
                    <td>${item.salidas}</td>
                    <td class="${item.inventario <= 3 ? 'low-stock' : ''}">${item.inventario}</td>
                    <td><button class="edit-btn" data-numero="${item.numero}">Editar</button></td>
                `;
                elements.tableBody.appendChild(row);
            });
            
            // Configurar eventos de edición
            setupEditButtons();
        }
        
        // Configurar botones de edición
        function setupEditButtons() {
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const numero = this.getAttribute('data-numero');
                    editProduct(numero);
                });
            });
        }
        
        // Editar producto
        async function editProduct(numero) {
            try {
                // Obtener datos actuales del producto
                const response = await fetch(`${APPS_SCRIPT_URL}?action=getInventory`);
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error('No se pudieron obtener los datos del producto');
                }
                
                const producto = data.inventory.find(item => item.numero == numero);
                if (!producto) {
                    throw new Error('Producto no encontrado');
                }
                
                // Solicitar nuevos valores
                const nuevaEntrada = prompt('Entradas actuales: ' + producto.entradas + '\n\nNuevo valor:', producto.entradas);
                if (nuevaEntrada === null) return;
                
                const nuevaSalida = prompt('Salidas actuales: ' + producto.salidas + '\n\nNuevo valor:', producto.salidas);
                if (nuevaSalida === null) return;
                
                const nuevoInventario = prompt('Inventario actual: ' + producto.inventario + '\n\nNuevo valor:', producto.inventario);
                if (nuevoInventario === null) return;
                
                // Validar valores numéricos
                if (isNaN(nuevaEntrada) throw new Error('Entradas debe ser un número');
                if (isNaN(nuevaSalida)) throw new Error('Salidas debe ser un número');
                if (isNaN(nuevoInventario)) throw new Error('Inventario debe ser un número');
                
                // Actualizar en Google Sheets
                const updateResponse = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: "updateInventory",
                        numero: numero,
                        entradas: Number(nuevaEntrada),
                        salidas: Number(nuevaSalida),
                        inventario: Number(nuevoInventario)
                    })
                });
                
                const result = await updateResponse.json();
                
                if (!result.success) {
                    throw new Error(result.message || 'Error al actualizar');
                }
                
                // Recargar inventario
                await loadInventory();
                showSuccess('Producto actualizado correctamente');
                
            } catch (error) {
                showError(error.message);
            }
        }
        
        // Funciones auxiliares de UI
        function showLoading() {
            elements.loading.style.display = 'block';
        }
        
        function hideLoading() {
            elements.loading.style.display = 'none';
        }
        
        function showError(message) {
            elements.error.textContent = message;
            elements.error.style.display = 'block';
            setTimeout(() => elements.error.style.display = 'none', 5000);
        }
        
        function showSuccess(message) {
            elements.success.textContent = message;
            elements.success.style.display = 'block';
            setTimeout(() => elements.success.style.display = 'none', 5000);
        }
        
        function hideMessages() {
            elements.error.style.display = 'none';
            elements.success.style.display = 'none';
        }
    </script>
</body>
</html>
