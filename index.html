<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    .table-responsive { max-height: 60vh; overflow-y: auto; }
    .alert-position { position: fixed; top: 20px; right: 20px; z-index: 1000; }
    #productSearchFeedback { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); }
  </style>
</head>
<body>
  <div class="container py-4">
    <div id="alertContainer" class="alert-position"></div>
    
    <div class="card mb-4">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Register Movement</h5>
      </div>
      <div class="card-body">
        <form id="inventoryForm">
          <div class="row g-3 align-items-center">
            <div class="col-md-2">
              <select class="form-select" id="movementType" required>
                <option value="entrada"><i class="bi bi-box-arrow-in-down"></i> Entry</option>
                <option value="salida"><i class="bi bi-box-arrow-up"></i> Exit</option>
              </select>
            </div>
            <div class="col-md-2">
              <input type="number" class="form-control" id="productNumber" placeholder="Product #" min="1" required>
            </div>
            <div class="col-md-4 position-relative">
              <input type="text" class="form-control" id="productName" placeholder="Product name" readonly>
              <div id="productSearchFeedback"></div>
            </div>
            <div class="col-md-2">
              <input type="number" class="form-control" id="quantity" placeholder="Quantity" min="1" required>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-primary w-100" id="registerBtn">
                <i class="bi bi-save"></i> Register
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-clipboard-data"></i> Current Inventory</h5>
        <div>
          <button class="btn btn-sm btn-outline-secondary" id="refreshBtn">
            <i class="bi bi-arrow-clockwise"></i> Refresh
          </button>
          <span class="badge bg-primary ms-2">Total: <span id="totalItems">0</span></span>
          <span class="badge bg-warning text-dark ms-2">Low stock: <span id="lowStockItems">0</span></span>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th width="8%">#</th>
              <th width="30%">Product Name</th>
              <th width="25%">Type</th>
              <th width="12%">Entries</th>
              <th width="12%">Exits</th>
              <th width="13%">Inventory</th>
            </tr>
          </thead>
          <tbody id="inventoryTable">
            <tr>
              <td colspan="6" class="text-center py-4">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2">Loading inventory...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
