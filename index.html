<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container">
        <h1>Inventario Klandestino</h1>
        
        <!-- Formulario de movimientos -->
        <div class="card">
            <h2>Registrar Movimiento</h2>
            <form id="movimiento-form">
                <div class="form-group">
                    <label for="tipo-movimiento">Tipo:</label>
                    <select id="tipo-movimiento" required>
                        <option value="">Seleccionar...</option>
                        <option value="entrada">Entrada</option>
                        <option value="salida">Salida</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="producto-id">Producto:</label>
                    <select id="producto-id" required>
                        <option value="">Cargando productos...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" min="1" required>
                </div>
                
                <button type="submit">Registrar</button>
            </form>
        </div>
        
        <!-- Tabla de inventario -->
        <div class="card">
            <h2>Inventario Actual <span id="inventario-count"></span></h2>
            <div id="loading">Cargando inventario...</div>
            <div id="error-message" class="error"></div>
            
            <table id="inventario-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Entradas</th>
                        <th>Salidas</th>
                        <th>Inventario</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
