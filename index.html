<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario de Pans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .stock-bajo {
      background-color: #ffebee !important;
      font-weight: bold;
    }
    .table-responsive {
      max-height: 500px;
      overflow-y: auto;
    }
    .btn-action {
      width: 100%;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="text-center mb-4">
      <h1 class="display-4">🏷️ Inventario de Pans</h1>
      <p class="lead">Control de entradas y salidas</p>
    </div>

    <!-- Tarjeta de Registro -->
    <div class="card mb-4">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Registrar Movimiento</h5>
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3">
            <select class="form-select" id="movementType">
              <option value="entrada">📥 Entrada</option>
              <option value="salida">📤 Salida</option>
            </select>
          </div>
          <div class="col-md-3">
            <input type="text" class="form-control" id="productId" placeholder="ID del producto">
          </div>
          <div class="col-md-3">
            <input type="number" class="form-control" id="quantity" placeholder="Cantidad" min="1">
          </div>
          <div class="col-md-3">
            <button class="btn btn-primary btn-action" onclick="registrarMovimientoUI()">
              Registrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta de Inventario -->
    <div class="card">
      <div class="card-header bg-success text-white">
        <h5 class="mb-0">📋 Inventario Actual</h5>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Tipo</th>
                <th>Entradas</th>
                <th>Salidas</th>
                <th>Stock</th>
              </tr>
            </thead>
            <tbody id="inventoryTable">
              <!-- Los datos se cargarán aquí -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/TU_ID_SCRIPT/exec";

    // Cargar inventario al iniciar
    document.addEventListener('DOMContentLoaded', cargarInventario);

    async function cargarInventario() {
      try {
        const response = await fetch(`${API_URL}?action=getInventory`);
        const data = await response.json();
        
        const tbody = document.getElementById('inventoryTable');
        tbody.innerHTML = data.slice(4) // Saltar encabezados
          .filter(row => row[1]) // Filtrar filas vacías
          .map(row => `
            <tr class="${row[6] < 3 ? 'stock-bajo' : ''}">
              <td>${row[1]}</td>
              <td>${row[2]}</td>
              <td>${row[3]}</td>
              <td>${row[4] || 0}</td>
              <td>${row[5] || 0}</td>
              <td><strong>${row[6] || 0}</strong></td>
            </tr>
          `).join('');
          
      } catch (error) {
        console.error("Error:", error);
        document.getElementById('inventoryTable').innerHTML = `
          <tr>
            <td colspan="6" class="text-center text-danger">
              Error al cargar el inventario. Recarga la página.
            </td>
          </tr>
        `;
      }
    }

    async function registrarMovimientoUI() {
      const tipo = document.getElementById('movementType').value;
      const id = document.getElementById('productId').value;
      const cantidad = document.getElementById('quantity').value;
      
      if (!id || !cantidad || cantidad <= 0) {
        alert("❌ Por favor complete todos los campos correctamente");
        return;
      }

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: new URLSearchParams({
            action: 'registerMovement',
            tipo: tipo,
            id: id,
            cantidad: cantidad
          })
        });
        
        const result = await response.json();
        
        if (result.success) {
          alert("✅ Movimiento registrado correctamente");
          document.getElementById('productId').value = '';
          document.getElementById('quantity').value = '';
          cargarInventario();
        } else {
          throw new Error(result.error || "Error desconocido");
        }
      } catch (error) {
        console.error("Error:", error);
        alert(`❌ Error: ${error.message}`);
      }
    }
  </script>
</body>
</html>
