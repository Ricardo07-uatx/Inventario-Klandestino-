<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Inventario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container mt-4">
    <h1 class="text-center">Sistema de Inventario</h1>
    
    <div class="card mt-4">
      <div class="card-header">
        <h2>Registrar Movimiento</h2>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-6">
            <select id="movementType" class="form-select mb-3">
              <option value="entrada">Entrada</option>
              <option value="salida">Salida</option>
            </select>
          </div>
          <div class="col-md-6">
            <select id="productSelect" class="form-select mb-3"></select>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <input type="number" id="quantity" class="form-control mb-3" placeholder="Cantidad" min="1">
          </div>
          <div class="col-md-6">
            <button id="registerBtn" class="btn btn-primary w-100">Registrar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-header">
        <h2>Inventario Actual</h2>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped" id="inventoryTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Stock</th>
                <th>Entradas</th>
                <th>Salidas</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
